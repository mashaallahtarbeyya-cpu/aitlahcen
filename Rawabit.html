<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>روابط مفيدة - الأستاذ الحسن أيت لحسن</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      color: #1e3a5f;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 25px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-link {
      display: block;
      text-decoration: none;
      background-color: #1e3a5f;
      color: #ffffff;
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px rgba(30, 58, 95, 0.15);
    }

    .btn-link:hover {
      background-color: #0f766e;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(15, 118, 110, 0.25);
    }

    .btn-link:active {
      transform: translateY(0);
    }

    .visitor-counter {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px dashed #cbd5e1;
    }
  </style>
</head>
<body>

</div>
