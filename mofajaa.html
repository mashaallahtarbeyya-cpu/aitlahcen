<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المفاجأة اليومية - موقع الأستاذ الحسن أيت لحسن</title>
  <link rel="icon" type="image/png" href="logo.png.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html { font-size: 19px !important; }
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .quran { font-family: 'Amiri', serif; font-size: 22px; line-height: 2; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between p-4">

  <header class="max-w-2xl mx-auto text-center py-6 px-4 bg-gradient-to-r from-emerald-800 to-teal-700 text-white rounded-2xl shadow-md my-4 w-full">
    <h1 class="text-2xl font-extrabold text-amber-300 mb-2">🎁 مفاجأة اليوم 🎁</h1>
    <p class="text-sm font-medium">كل يوم مفاجأة جديدة من القلب... آية، دعاء، بشرى</p>
    <p id="dateToday" class="text-xs mt-2 opacity-80"></p>
  </header>

  <main class="max-w-2xl mx-auto w-full my-auto">
    <div id="daily-surprise-container" class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 text-center">
      <div id="surprise-header" class="text-xs font-bold text-emerald-800 bg-emerald-50 py-1.5 px-3 rounded-full inline-block mb-3"></div>
      <h2 id="surprise-title" class="text-xl font-extrabold text-slate-800 mb-3"></h2>
      <div id="surprise-content" class="text-slate-600 text-base leading-relaxed mb-4"></div>
      <div id="surprise-foot" class="text-sm text-emerald-700 font-bold bg-amber-50 py-3 px-4 rounded-xl"></div>

      <!-- أزرار المشاركة وإعادة العرض -->
      <div class="flex gap-2.5 justify-center mt-6 flex-wrap">
        <button onclick="shareWhats()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-sm transition-all">
          📤 صيفطها لشي واحد كتبغيه
        </button>
        <button onclick="shareFacebook()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-sm transition-all">
          📘 شارك على فيسبوك
        </button>
        <button onclick="location.reload()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-xl text-sm transition-all">
          🔄 عاود شوفها
        </button>
      </div>

      <!-- شريط الإحصائيات أسفل الأزرار -->
      <div class="mt-5 pt-4 border-t border-slate-100 grid grid-cols-3 gap-2.5 text-xs">
        <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200/70 flex flex-col items-center justify-center">
          <span class="text-slate-500 font-semibold mb-1.5">👁️ الزوار</span>
          <img src="https://visitor-badge.laobi.icu/badge?page_id=mashaallahtarbeyya-cpu.aitlahcen.mofajaa&left_text=&right_color=1e3a5f"
               alt="عدد الزوار"
               class="h-5">
        </div>

        <div class="bg-emerald-50/70 rounded-xl p-2.5 border border-emerald-200/70 flex flex-col items-center justify-center">
          <span class="text-emerald-800 font-semibold mb-1">📲 واتساب</span>
          <span id="waClickCount" class="text-base font-extrabold text-emerald-700">...</span>
        </div>

        <div class="bg-blue-50/70 rounded-xl p-2.5 border border-blue-200/70 flex flex-col items-center justify-center">
          <span class="text-blue-800 font-semibold mb-1">📘 فيسبوك</span>
          <span id="fbClickCount" class="text-base font-extrabold text-blue-700">...</span>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow p-4 mt-4 text-center">
      <p class="text-sm font-bold mb-2">📅 شوف مفاجأة نهار آخر:</p>
      <div class="flex gap-2 justify-center flex-wrap" id="daysBtns"></div>
    </div>

    <div class="text-center mt-6">
      <a href="index.html" class="inline-block bg-slate-700 hover:bg-slate-800 text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-all shadow">
        ← العودة إلى الصفحة الرئيسية
      </a>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-500 mt-8">
    موقع الأستاذ الحسن أيت لحسن &copy; 2026 - صدقة جارية ❤️
  </footer>

6:{type:"🌿 حكمة اليوم", title:"تأمل", content:"ما تأخر شيء إلا وفيه خير كبير ليك. ماشي كل تأخير حرمان، مرات التأخير حماية.", foot:"توكل على الله."},

12:{type:"💌 دعوة من القلب", title:"دعوة للمرضى", content:"اللهم اشف كل مريض، وخفف عليه ألمه، ورد عليه صحته أحسن مما كانت.", foot:"إلا كنت مريض، ربي يشافيك."},
13:{type:"🌈 بشرى", title:"لا تحزن", content:"ربي كيسمعك، وكايشوفك، وما ناسيكش. دعوتك اللي دعيتيها بالليل، راها محفوظة عندو.", foot:"غادي تفرح قريب، إن شاء الله."},

21:{type:"📖 آية قرآنية", title:"للمترددين", content:"﴿ وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ﴾", foot:"ثق في تدبير الله."},
22:{type:"💌 دعوة من القلب", title:"للأصدقاء", content:"الله يحفظ ليك الناس اللي كتبغيهم، ويبعد عليك الناس اللي كيبغيو ليك الشر.", foot:"صيفط هاد الدعوة لصاحبك."},

28:{type:"💌 دعوة من القلب", title:"دعوة من الأستاذ", content:"أنا الأستاذ الحسن، كندعي ليكم كاملين: الله يوفقكم، وينور طريقكم، ويجعل أيامكم كلها مفاجآت زوينة.", foot:"من القلب إلى القلب ❤️"},
29:{type:"🌈 بشرى", title:"بشرى أخيرة", content:"ربي ما كيخيبش اللي كيدعيه. دعي، وصبر، وتفاءل، وغادي تشوف العجب.", foot:"لا تحزن، إن الله معنا."},
30:{type:"📖 آية قرآنية", title:"ختم الشهر", content:"﴿ وَقُلِ الْحَمْدُ لِلَّهِ ﴾", foot:"الحمد لله على كل حال، على ما فات وما هو آت."},
31:{type:"🎁 مفاجأة خاصة", title:"نهار 31 - نهارك أنت", content:"إلا وصلتي لهنا، فأنت من الناس اللي كيقلبو على الخير. ربي يبارك فيك، ويعطيك مفاجأة زوينة في حياتك قريب.", foot:"هاد المفاجأة ليك بوحدك 🎁"}
};

let activeDay = new Date().getDate();

function getSurprise(day){
  return surprises[day] || surprises[1];
}

function render(day){
  activeDay = day;
  const s = getSurprise(day);
  document.getElementById('surprise-header').innerText = s.type + " • يوم " + day;
  document.getElementById('surprise-title').innerText = s.title;
  let c = document.getElementById('surprise-content');
  c.innerText = s.content;
  if(s.type.includes("آية") || (s.type.includes("بشرى") && s.content.includes("﴿"))) c.classList.add("quran");
  else c.classList.remove("quran");
  document.getElementById('surprise-foot').innerText = s.foot;
  document.getElementById('dateToday').innerText = "اليوم: " + new Date().toLocaleDateString('ar-MA', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

function shareWhats(){
  trackClick('whatsapp');
  const s = getSurprise(activeDay);
  const txt = "🎁 مفاجأة اليوم من موقع الأستاذ الحسن أيت لحسن:\n\n" + s.title + "\n" + s.content + "\n\n" + s.foot;
  window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
}

function shareFacebook(){
  trackClick('facebook');
  const pageUrl = encodeURIComponent(window.location.href);
  window.open("https://www.facebook.com/sharer/sharer.php?u=" + pageUrl, "_blank");
}

const ns = "aitlahcen-site";
const keys = {
  whatsapp: "mofajaa-wa-clicks",
  facebook: "mofajaa-fb-clicks"
};
const elements = {
  whatsapp: document.getElementById("waClickCount"),
  facebook: document.getElementById("fbClickCount")
};

async function loadCounts() {
  for (const platform of ["whatsapp", "facebook"]) {
    const key = keys[platform];
    const el = elements[platform];
    try {
      const res = await fetch(`https://api.counterapi.dev/v1/${ns}/${key}`);
      if (res.ok) {
        const data = await res.json();
        el.innerText = data.count ?? 0;
      } else {
        el.innerText = localStorage.getItem(key) || "0";
      }
    } catch (e) {
      el.innerText = localStorage.getItem(key) || "0";
    }
  }
}

async function trackClick(platform) {
  const key = keys[platform];
  const el = elements[platform];
  const nextVal = (parseInt(el.innerText) || 0) + 1;
  el.innerText = nextVal;
  localStorage.setItem(key, nextVal);

  try {
    const res = await fetch(`https://api.counterapi.dev/v1/${ns}/${key}/up`);
    if (res.ok) {
      const data = await res.json();
      el.innerText = data.count;
    }
  } catch (e) {
    // الاحتفاظ بالقيمة المحلية عند تعذر الاتصال
  }
}

let btns = "";
for(let i=1;i<=31;i++){
  btns += `<button onclick="render(${i})" class="w-9 h-9 rounded-full text-xs font-bold ${i===new Date().getDate()?'bg-emerald-700 text-white':'bg-slate-100 hover:bg-slate-200'}">${i}</button>`;
}
document.getElementById('daysBtns').innerHTML = btns;

window.addEventListener("DOMContentLoaded", () => {
  render(new Date().getDate());
  loadCounts();
});
</script>

</body>
</html>
