:root{--bg:#f3f6f4;--card:#fff;--ink:#1c2a24;--mute:#5d6d65;--line:#d5ded9;--accent:#1f6b4f;--soft:#e3f1ea;--star:#c28a00}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1a2420;--ink:#e6efea;--mute:#9db0a6;--line:#2c3a34;--accent:#6fcf9f;--soft:#1f3329;--star:#f0c040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:980px;margin:auto;padding:0 1rem}
header{padding:1.8rem 0 .5rem}
h1{margin:0;font-size:1.7rem}
header p{margin:.2rem 0 0;color:var(--mute)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:.7rem 0;border-bottom:1px solid var(--line)}
#q{width:100%;padding:.7rem 1rem;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.6rem 0 .1rem;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.3rem .85rem;border-radius:999px;font:inherit;font-size:.95rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
h2{font-size:1.2rem;margin:1.6rem 0 .2rem}
h3{font-size:1rem;color:var(--mute);margin:1rem 0 .2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem;margin-top:.5rem}
.card{display:flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.15rem .3rem .15rem .15rem}
.card:hover{border-color:var(--accent)}
.card a{flex:1;min-width:0;padding:.5rem .7rem;color:var(--ink);text-decoration:none;display:block}
.card b{display:block;font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mute);direction:ltr;display:block;text-align:right;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{flex:none;border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--mute);padding:.3rem .5rem;border-radius:8px}
.star[aria-pressed=true]{color:var(--star)}
.empty{color:var(--mute);padding:2rem 0;text-align:center}
.count{color:var(--mute);font-size:.9rem;margin:.7rem 0 0}
footer{color:var(--mute);font-size:.88rem;padding:2rem 0}
</style>

const STAR_KEY='fav-stars-v1';
let stars=new Set();
try{stars=new Set(JSON.parse(localStorage.getItem(STAR_KEY)||'[]'))}catch(e){}
function saveStars(){try{localStorage.setItem(STAR_KEY,JSON.stringify([...stars]))}catch(e){}}

const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const flat=(f,path=[])=>[].concat(
  f.items.map(([t,u])=>({t,u,path:path.concat(f.name)})),
  ...f.kids.map(k=>flat(k,path.concat(f.name))));
const ALL=[].concat(...DATA.map(f=>flat(f)));

let current='all';
const q=document.getElementById('q'), root=document.getElementById('root'), chips=document.getElementById('chips');

function mkChip(label,key){
  const b=document.createElement('button');
  b.className='chip';b.type='button';b.textContent=label;b.dataset.key=key;
  b.onclick=()=>{current=key;q.value='';render()};
  chips.append(b);
}
mkChip('الكل','all');mkChip('★ نجومي','stars');
DATA.forEach((f,i)=>mkChip(f.name,String(i)));

function card(x){
  const d=document.createElement('div');d.className='card';
  const a=document.createElement('a');a.href=x.u;a.target='_blank';a.rel='noopener noreferrer';
  const b=document.createElement('b');b.textContent=x.t;b.title=x.t;
  const s=document.createElement('small');s.textContent=host(x.u);
  a.append(b,s);
  const st=document.createElement('button');st.type='button';st.className='star';
  const on=stars.has(x.u);st.textContent=on?'★':'☆';st.setAttribute('aria-pressed',on);
  st.setAttribute('aria-label','إضافة إلى نجومي');
  st.onclick=()=>{stars.has(x.u)?stars.delete(x.u):stars.add(x.u);saveStars();render()};
  d.append(a,st);return d;
}
function grid(list){
  const g=document.createElement('div');g.className='grid';
  const seen=new Set();
  list.forEach(x=>{if(seen.has(x.u))return;seen.add(x.u);g.append(card(x))});
  return g;
}
function section(f,level){
  const frag=document.createDocumentFragment();
  const h=document.createElement(level?'h3':'h2');h.textContent=f.name;frag.append(h);
  if(f.items.length)frag.append(grid(f.items.map(([t,u])=>({t,u}))));
  f.kids.forEach(k=>frag.append(section(k,level+1)));
  return frag;
}
function render(){
  chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.key===current&&!q.value.trim()));
  root.replaceChildren();
  const t=q.value.trim().toLowerCase();
  const note=n=>{const p=document.createElement('p');p.className='count';p.textContent=n+' رابط';root.append(p)};
  if(t){
    const r=ALL.filter(x=>(x.t+' '+x.u+' '+x.path.join(' ')).toLowerCase().includes(t));
    if(!r.length){root.innerHTML='<p class="empty">لا توجد نتائج مطابقة.</p>';return}
    note(new Set(r.map(x=>x.u)).size);root.append(grid(r));return;
  }
  if(current==='stars'){
    const r=ALL.filter(x=>stars.has(x.u));
    if(!r.length){root.innerHTML='<p class="empty">لم تضف نجوماً بعد. اضغط ☆ بجانب أي رابط لتجده هنا دائماً.</p>';return}
    root.append(grid(r));return;
  }
  const list=current==='all'?DATA:[DATA[+current]];
  if(stars.size&&current==='all'){
    const h=document.createElement('h2');h.textContent='★ نجومي';root.append(h);
    root.append(grid(ALL.filter(x=>stars.has(x.u))));
  }
  list.forEach(f=>root.append(section(f,0)));
}
q.addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
});
render();
