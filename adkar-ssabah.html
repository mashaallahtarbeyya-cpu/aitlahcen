<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أذكار الصباح</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#12121A;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#1E1E2E;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2A2A3A}
header h1{font-size:22px;font-weight:700}
header button{background:none;border:none;font-size:22px;color:#D4A84B;cursor:pointer}
header .back{color:#D4A84B;font-size:28px}
main{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:28px 18px 22px}
.card{background:#1E1E2E;border-radius:16px;padding:28px 20px;text-align:center;min-height:260px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card p{font-size:26px;line-height:2.1;font-weight:600}
.card p.small{font-size:22px;line-height:2}
.controls{display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:28px}
.arrow{background:none;border:none;color:#D4A84B;font-size:42px;cursor:pointer;padding:10px}
.circle{width:120px;height:120px;border-radius:50%;background:#1E1E2E;border:2px solid #55566A;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;user-select:none;transition:.15s}
.circle:active{transform:scale(.94);background:#2A2A3A}
.circle.done{border-color:#D4A84B}
.counter-label{font-size:14px;color:#ccc}
.total{font-size:15px}
.progress{height:4px;background:#2A2A3A;border-radius:10px;overflow:hidden;margin:0 18px}
.progress div{height:100%;background:#D4A84B;width:0;transition:.3s}
.footer{display:flex;justify-content:space-between;padding:10px 18px 14px;color:#aaa;font-size:13px}
.footer button{background:none;border:none;color:#D4A84B;font-size:13px;cursor:pointer}
.done-screen{text-align:center;padding:40px 20px}
.done-screen h2{font-size:28px;margin-bottom:12px;color:#D4A84B}
.done-screen p{color:#ccc;line-height:1.9}
</style>
</head>
<body>
  <div style="position:fixed;top:0;right:0;left:0;z-index:100;background:#065f46;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)">
  <b style="font-size:13px">🤲 حصن المسلم</b>
  <div style="display:flex;gap:6px">
    <a href="https://mashaallahtarbeyya-cpu.github.io/aitlahcen/" style="background:#fff;color:#065f46;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900">🏠 الأصلي</a>
    <a href="https://aitlahcenelhassan983-stack.github.io/bank.mashallah/" style="background:#f59e0b;color:#111;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900">🌿 البنك</a>
  </div>
</div>
<header>
<button onclick="resetAll()">↺</button>
<h1>أذكار الصباح</h1>
<button class="back" onclick="prev()">›</button>
</header>
<div class="progress"><div id="bar"></div></div>
<main id="main">
<div class="card"><p id="text"></p></div>
<div class="controls">
<div class="total" id="pos">1/25</div>
<div class="row">
<button class="arrow" onclick="prev()">‹</button>
<div class="circle" id="circle" onclick="tap()">0</div>
<button class="arrow" onclick="next()">›</button>
</div>
<div class="counter-label" id="need">مرة واحدة</div>
</div>
</main>
<div class="footer"><span id="totalDone">أنجزت: 0</span><button onclick="resetAll()">إعادة من الأول</button></div>
<script>
const adhkar=[
{t:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",n:1},
{t:"قُلْ هُوَ اللَّهُ أَحَدٌ (1) اللَّهُ الصَّمَدُ (2) لَمْ يَلِدْ وَلَمْ يُولَدْ (3) وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ (4)",n:3},
{t:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ (1) مِن شَرِّ مَا خَلَقَ (2) وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ (3) وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ (4) وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ (5)",n:3},
{t:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ (1) مَلِكِ النَّاسِ (2) إِلَٰهِ النَّاسِ (3) مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ (4) الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ (5) مِنَ الْجِنَّةِ وَالنَّاسِ (6)",n:3},
{t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",n:1},
{t:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",n:1},
{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",n:1},
{t:"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",n:4},
{t:"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",n:1},
{t:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ",n:3},
{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",n:3},
{t:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",n:7},
{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",n:1},
{t:"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",n:1},
{t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",n:3},
{t:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",n:3},
{t:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",n:1},
{t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ",n:1},
{t:"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",n:1},
{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",n:100},
{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ",n:3},
{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا",n:1},
{t:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",n:100},
{t:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",n:10},
{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:100},
];
let idx=parseInt(localStorage.getItem('sabah_idx')||0);
let counts=JSON.parse(localStorage.getItem('sabah_counts')||'{}');
let cur=counts[idx]||0;
function save(){localStorage.setItem('sabah_idx',idx);counts[idx]=cur;localStorage.setItem('sabah_counts',JSON.stringify(counts));}
function render(){
if(idx>=adhkar.length){
document.getElementById('main').innerHTML='<div class="done-screen"><h2>تقبل الله منا ومنكم 🤲</h2><p>أتممت أذكار الصباح كاملة<br>اللهم اجعل هذا اليوم خيرًا وبركة</p></div>';
document.getElementById('bar').style.width='100%';return;}
let a=adhkar[idx];
document.getElementById('text').textContent='“ '+a.t+' ”';
document.getElementById('text').className=a.t.length>250?'small':'';
document.getElementById('pos').textContent=(idx+1)+'/25';
document.getElementById('circle').textContent=cur;
document.getElementById('need').textContent=a.n===1?'مرة واحدة':a.n+' مرات';
document.getElementById('bar').style.width=((idx)/25*100)+'%';
let done=Object.keys(counts).filter(k=>counts[k]>=adhkar[k].n).length;
document.getElementById('totalDone').textContent='أنجزت: '+done+' / 25';
}
function tap(){
let a=adhkar[idx];cur++;
if(navigator.vibrate) navigator.vibrate(10);
if(cur>=a.n){save();idx++;cur=counts[idx]||0;save();if(idx>=adhkar.length){render();return;}}
save();render();
}
function next(){if(idx<adhkar.length-1){idx++;cur=counts[idx]||0;save();render();}}
function prev(){if(idx>0){idx--;cur=counts[idx]||0;save();render();}}
function resetAll(){if(confirm('تبغي تعاود من الأول؟')){idx=0;cur=0;counts={};localStorage.removeItem('sabah_idx');localStorage.removeItem('sabah_counts');location.reload();}}
render();
</script>
</body>
</html>
