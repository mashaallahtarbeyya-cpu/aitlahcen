<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حكمة اليوم - قصيدة الألبيري لابنه | بوابات الأستاذ الحسن</title>
<style>
body{font-family:'Tajawal',Tahoma,Arial;background:#fdf6e3;margin:0;padding:18px;color:#333}
.box{max-width:700px;margin:auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.12);text-align:center}
.date{background:#065f46;color:#fff;display:inline-block;padding:8px 18px;border-radius:20px;font-size:15px}
h1{color:#8a6d1b;margin:18px 0 5px;font-size:26px}
.sub{color:#888;font-size:14px}
.poem{font-size:25px;line-height:2.2;background:#fff8dc;border:1px solid #e8d48a;padding:22px;border-radius:14px;margin:20px 0;font-weight:bold}
.sharh{font-size:18px;line-height:1.9;background:#f7f7f7;padding:16px;border-radius:12px;color:#444;text-align:right}
.btns{margin-top:22px;display:flex;gap:10px;justify-content:center}
.btns button{padding:11px 20px;border:none;border-radius:25px;font-size:16px;cursor:pointer}
.prev{background:#eee}
.next{background:#c9a227;color:#fff}
.links{margin-top:25px}
.links a{color:#065f46;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<span class="date" id="todayDate"></span>
<h1>🌙 حكمة اليوم</h1>
<p class="sub">من قصيدة أبي إسحاق الألبيري لابنه أبي بكر - بيت جديد كل يوم</p>

<div class="poem" id="poem"></div>
<div class="sharh" id="sharh"></div>

<div class="btns">
<button class="prev" onclick="changeDay(-1)">⬅️ أمس</button>
<button class="next" onclick="changeDay(1)">غداً ➡️</button>
</div>

<p style="margin-top:20px;color:#999;font-size:14px" id="dayNum"></p>

<div class="links">
<a href="index.html">⬅️ الرئيسية</a> &nbsp; | &nbsp; <a href="https://aitlahcenelhassan983-stack.github.io/bank.mashallah/">🏦 البنك</a>
</div>
</div>

<script>
const data=[
["تَفُتُّ فُؤادَكَ الأَيَّامُ فَتًّا / وَتَنْحَتُ جِسْمَكَ السَّاعَاتُ نَحْتًا","الأيام تمضي وتأخذ من عمرك وصحتك، فانتبه قبل أن يفوت الأوان."],
["وَتَدْعُوكَ المَنُونُ دُعَاءَ صِدْقٍ / أَلَا يَا صَاحِ أَنْتَ أُرِيدُ أَنْتَا","الموت يناديك بصدق، فلا تظن أنك ستنجو منه."],
["أَرَاكَ تُحِبُّ عَرْسًا ذَاتَ خَدْرٍ / أَبَتْ طَلَاقَهَا الأَكْيَاسُ بَتًّا","أنت تحب الدنيا وهي لا تدوم، والعقلاء طلقوها ولم يتعلقوا بها."],
["تَنَامُ الدَّهْرَ وَيْحَكَ فِي غَطِيطٍ / بِهَا حَتَّى إِذَا مِتَّ انْتَبَهْتَا","تنام غافلا عن الآخرة، ولن تستيقظ إلا بعد الموت."],
["فَكَمْ ذَا أَنْتَ مَخْدُوعٌ وَحَتَّى / مَتَى لَا تَرْعَوِي عَنْهَا وَحَتَّى","إلى متى ستبقى مخدوعا بالدنيا؟ متى ستعود إلى رشدك؟"],
["أَبَا بَكْرٍ دَعَوْتُكَ لَوْ أَجَبْتَا / إِلَى مَا فِيهِ حَظُّكَ لَوْ عَقَلْتَا","يا بني، أدعوك إلى ما فيه خيرك لو فهمت وعقلت."],
["إِلَى عِلْمٍ تَكُونُ بِهِ إِمَامًا / مُطَاعًا إِنْ نَهَيْتَ وَإِنْ أَمَرْتَا","إلى العلم، فبه تصير إماما مطاعا يحترمك الناس."],
["وَيَجْلُو مَا بِعَيْنِكَ مِنْ غِشَاهَا / وَيَهْدِيكَ الطَّرِيقَ إِذَا ضَلَلْتَا","العلم يزيل الغشاوة عن عينيك ويهديك إذا ضللت الطريق."],
["وَتَحْمِلُ مِنْهُ فِي نَادِيكَ تَاجًا / وَيَكْسُوكَ الجَمَالَ إِذَا عَرِيتَا","العلم تاج تلبسه في المجالس، وجمال يكسوك إذا كنت عاريا من المال."],
["يَنَالُكَ نَفْعُهُ مَا دُمْتَ حَيًّا / وَيَبْقَى ذِكْرُهُ لَكَ إِنْ ذَهَبْتَا","نفع العلم يبقى معك في حياتك، وذكره يبقى بعد موتك."],
["هُوَ العَضْبُ المُهَنَّدُ لَيْسَ يَنْبُو / تُصِيبُ بِهِ مَقَاتِلَ مَنْ ضَرَبْتَا","العلم سيف قاطع لا ينكسر، تصيب به هدفك دائما."],
["وَكَنْزٌ لَا تَخَافُ عَلَيْهِ لِصًّا / خَفِيفُ الحَمْلِ يُوجَدُ حَيْثُ كُنْتَا","العلم كنز لا يسرقه اللصوص، خفيف تحمله معك أينما ذهبت."],
["يَزِيدُ بِكَثْرَةِ الإِنْفَاقِ مِنْهُ / وَيَنْقُصُ إِنْ بِهِ كَفًّا شَدَدْتَا","العلم يزيد إذا أنفقته وعلمته للناس، وينقص إذا بخلت به."],
["فَلَوْ قَدْ ذُقْتَ مِنْ حَلْوَاهُ طَعْمًا / لَآثَرْتَ التَّعَلُّمَ وَاجْتَهَدْتَا","لو ذقت حلاوة العلم، لفضلته على كل شيء واجتهدت فيه."],
["وَلَمْ يَشْغَلْكَ عَنْهُ هَوًى مُطَاعٌ / وَلَا دُنْيَا بِزُخْرُفِهَا فُتِنْتَا","لن يشغلك عن العلم هوى ولا زخرف الدنيا إذا عرفت قيمته."],
["وَلَا أَلْهَاكَ عَنْهُ أَنِيقُ رَوْضٍ / وَلَا خِدْرٌ بِزِينَتِهَا كُلِفْتَا","لن يلهيك عن العلم جمال الطبيعة ولا زينة النساء."],
["فَقُوتُ الرُّوحِ أَرْوَاحُ المَعَانِي / وَلَيْسَ بِأَنْ طَعِمْتَ وَلَا شَرِبْتَا","غذاء الروح هو المعاني والعلم، وليس الأكل والشرب."],
["فَوَاظِبْهُ وَخُذْ بِالجِدِّ فِيهِ / فَإِنَّ أَعْطَاكَهُ اللهُ أَخَذْتَا","واظب على العلم وخذ بالجد، فإن أعطاك الله إياه فقد أخذت الخير كله."],
["وَإِنْ أُوتِيتَ فِيهِ طَوِيلَ بَاعٍ / وَقَالَ النَّاسُ إِنَّكَ قَدْ عَلِمْتَا","إذا صرت عالما وقال الناس إنك قد علمت، فلا تغتر."],
["فَلَا تَأْمَنْ سُؤَالَ اللهِ عَنْهُ / بِتَوْبِيخٍ: عَلِمْتَ فَهَلْ عَمِلْتَا","لا تأمن سؤال الله: علمت، فهل عملت بما علمت؟"],
["فَرَأْسُ العِلْمِ تَقْوَى اللهِ حَقًّا / وَلَيْسَ بِأَنْ يُقَالَ لَقَدْ رَأَسْتَا","رأس العلم هو تقوى الله، وليس أن يقال عنك رئيس."],
["وَضَافِ إِلَى الَّذِي يَبْلُغُكَ مِنْهُ / وَلَمْ تَكُ طَائِشًا تَبْغِي شَتَاتَا","أضف إلى علمك دائما، ولا تكن طائشا تبحث عن التفرق."],
["وَإِنْ تَرْغَبْ عَنِ الحَسْنَاءِ يَوْمًا / فَمَا تَدْرِي لَعَلَّكَ قَدْ رُزِقْتَا","إن تركت الدنيا اليوم، لعل الله يرزقك خيرا منها."],
["وَمَا تُدْرِي إِذَا أَذْكَيْتَ نَارًا / لِغَيْرِكَ أَنْ تَكُونَ بِهَا صَلِيتَا","قد تشعل نارا لغيرك، فتكون أنت أول من يحترق بها."],
["وَمَا تُدْرِي إِذَا أَرْسَلْتَ سَهْمًا / لِغَيْرِكَ أَنْ تَكُونَ بِهِ أُصِبْتَا","قد ترمي سهما لغيرك، فيعود إليك فيصيبك."],
["وَمَا تَدْرِي بِأَنَّكَ قَدْ هَدَيْتَا / لِغَيْرِكَ مَا بِهِ لَوْ كُنْتَ عَمِلْتَا","قد تهدي غيرك إلى خير لم تعمل به أنت، فابدأ بنفسك."],
["فَلَا تَغْتَرَّ بِالدُّنْيَا وَحُسْنِهَا / فَإِنَّكَ مِنْهَا لَا بُدَّ مُنْتَقَلَا","لا تغتر بالدنيا وحسنها، فإنك منها لا بد راحل."],
["وَلَا تَحْسَبْ أَنَّ المَالَ يَنْفَعُ / إِذَا مَا أَنْتَ بِالعَمَلِ الصَّالِحِ لَمْ تَكُ","لا تظن أن المال ينفعك إذا لم يكن معه عمل صالح."],
["وَإِنْ تَشْكُ لِلنَّاسِ جُرْحًا أَنْتَ صَاحِبُهُ / لَا يُؤْلِمُ الجُرْحَ إِلَّا مَنْ بِهِ أَلَمُ","لا تشك جرحك للناس، فلا يشعر بألمك إلا أنت."],
["وَإِنْ تَضِقْ بِكَ الدُّنْيَا فَقُلْ: يَا اللهُ / فَبَابُ اللهِ لَا يُغْلَقُ أَبَدًا","إذا ضاقت بك الدنيا، فقل يا الله، فبابه مفتوح دائما."],
["وَخَيْرُ النَّاسِ مَنْ كَانَ لِلنَّاسِ نَافِعًا / وَشَرُّهُمْ مَنْ كَانَ لِلنَّاسِ ضَارًّا","خير الناس من ينفع الناس، وشرهم من يضرهم."]
];

let offset = 0;
function show(){
  const now = new Date();
  now.setDate(now.getDate() + offset);
  const day = now.getDate();
  const index = day - 1;
  document.getElementById('poem').innerHTML = data[index][0];
  document.getElementById('sharh').innerHTML = "<b>الشرح:</b> " + data[index][1];
  document.getElementById('dayNum').innerText = "البيت رقم " + day + " من قصيدة الألبيري";
  document.getElementById('todayDate').innerText = now.toLocaleDateString('ar-MA', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function changeDay(n){ offset += n; show(); }
show();
</script>
</body>
</html>
