<div class="amazigh-quote">
  <p class="intro">
    كما قال الشاعر الأمازيغي السوسي <strong>بوجمعة أترودانت</strong> في قصيدة له عن الأمل والتفاؤل:
  </p>

  <blockquote class="amazigh-poem">
    <p>أتيزوا أورتالامت إغ إزري الصيف،</p>
    <p>اقند أجديك أيخلف إدل أكال.</p>
  </blockquote>

  <p class="translation">
    <strong>المعنى التقريبي:</strong> لا تيأس مهما رأيت الصيف قاسياً،  
    فالليل يمرّ ويأتي بعده النهار.
  </p>
</div>
