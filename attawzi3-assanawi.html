<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#1c2a24;--mute:#5d6d65;--line:#d5ded9;--ac:#1f6b4f;--soft:#e3f1ea;--in:#fff6d8}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1a2420;--ink:#e6efea;--mute:#9db0a6;--line:#2c3a34;--ac:#6fcf9f;--soft:#1f3329;--in:#2f2a14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:auto;padding:0 1rem 2rem}
h1{font-size:1.5rem;margin:1.2rem 0 .2rem}
.sub{color:var(--mute);margin:0 0 .8rem}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;position:sticky;top:0;background:var(--bg);padding:.6rem 0;z-index:3;border-bottom:1px solid var(--line)}
button,select,input{font:inherit;color:var(--ink)}
.tab{border:1px solid var(--line);background:var(--card);padding:.35rem 1rem;border-radius:999px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
select,#q{padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#q{flex:1;min-width:150px}
.btn{border:1px solid var(--ac);background:none;color:var(--ac);padding:.3rem .7rem;border-radius:8px;cursor:pointer}
.stat{color:var(--mute);font-size:.9rem;margin:.6rem 0}
.box{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--soft);position:sticky;top:0}
td.n{font-weight:700;text-align:center;color:var(--ac)}
td.c{text-align:center}
tr.sep td{background:var(--soft);font-weight:700}
.lk{width:100%;min-width:200px;padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--in);direction:ltr;text-align:left}
.act{display:flex;gap:.3rem;align-items:center}
.act a,.act button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:.2rem .5rem;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.85rem}
.ok{color:var(--ac);font-weight:700}
</style>
</head>

<div class="wrap">
<h1>شبكة حصص اللغة العربية 2026/2027</h1>
<p class="sub">ابحث عن الحصة، والصق رابط ملفها في الخانة الصفراء. ثم أعطني <b>المستوى والرقم</b> فقط، مثل «الثانية – رقم 11».</p>

const NAMES={"1":"الأولى إعدادي","2":"الثانية إعدادي"};
const KEY='lessons-grid-links-v1';
let links={};
try{links=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(links))}catch(e){}};
let lvl='1';
const $=id=>document.getElementById(id), tb=$('tb');

function fillFilters(){
  const rows=DATA[lvl];
  const sts=[...new Set(rows.map(r=>r[2]))], tys=[...new Set(rows.map(r=>r[6]))];
  $('st').innerHTML='<option value="">كل المراحل</option>'+sts.map(s=>`<option>${s}</option>`).join('');
  $('ty').innerHTML='<option value="">كل الأنواع</option>'+tys.map(s=>`<option>${s}</option>`).join('');
}
function render(){
  const q=$('q').value.trim(), st=$('st').value, ty=$('ty').value;
  tb.replaceChildren();
  let shown=0, last='';
  DATA[lvl].forEach(r=>{
    const [id,sem,stage,unit,wk,ss,typ,title,pg]=r;
    if(st&&stage!==st)return; if(ty&&typ!==ty)return;
    if(q&&!(String(id)===q||(title+' '+typ+' '+unit).includes(q)))return;
    if(stage!==last){last=stage;
      const s=document.createElement('tr');s.className='sep';
      s.innerHTML=`<td colspan="6">المرحلة ${stage} · الأسدس ${sem} · ${r.length?'':''}${DATA[lvl].find(x=>x[2]===stage)[2]===stage?'':''}</td>`;tb.append(s)}
    const k=lvl+'-'+id, tr=document.createElement('tr');
    tr.innerHTML=`<td class="n">${id}</td><td class="c">أ${wk} · ح${ss}</td><td></td><td></td><td class="c">${pg??'—'}</td><td></td>`;
    tr.cells[2].textContent=typ; tr.cells[3].textContent=title+(unit==='تقويم المرحلة'?'':'');
    const inp=document.createElement('input');inp.className='lk';inp.type='url';inp.placeholder='https://drive.google.com/…';inp.value=links[k]||'';
    const act=document.createElement('div');act.className='act';
    const open=document.createElement('a');open.textContent='فتح ↗';open.target='_blank';open.rel='noopener noreferrer';
    const cp=document.createElement('button');cp.type='button';cp.textContent='نسخ المرجع';
    const sync=()=>{open.hidden=!inp.value.trim();if(!open.hidden)open.href=inp.value.trim()};
    inp.addEventListener('input',()=>{const v=inp.value.trim();v?links[k]=v:delete links[k];save();sync();stats()});
    cp.onclick=()=>{const t=`${NAMES[lvl]} – رقم ${id}: ${typ} ${title}`+(pg?` ص${pg}`:'');
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent='تم ✓';setTimeout(()=>cp.textContent='نسخ المرجع',1200)}).catch(()=>prompt('انسخ المرجع:',t))};
    sync();act.append(open,cp);tr.cells[5].append(inp,act);tb.append(tr);shown++;
  });
  stats(shown);
}
function stats(n){
  const tot=DATA[lvl].length, done=DATA[lvl].filter(r=>links[lvl+'-'+r[0]]).length;
  $('stat').innerHTML=`${NAMES[lvl]}: <span class="ok">${done}</span> من ${tot} حصة رُبط ملفها`+(n!==undefined?` · المعروض ${n}`:'');
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  lvl=b.dataset.l;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('q').value='';fillFilters();render()});
['st','ty'].forEach(i=>$(i).onchange=render);$('q').oninput=render;
$('ex').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(links,null,1)],{type:'application/json'}));
  a.download='lessons-links.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('im').onclick=()=>$('fi').click();
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&typeof o==='object'){Object.assign(links,o);save();render()}}catch(x){alert('ملف غير صالح')}};
  r.readAsText(f);e.target.value=''};
fillFilters();render();
</script>
