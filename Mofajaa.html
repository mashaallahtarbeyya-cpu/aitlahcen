<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المفاجأة اليومية - موقع الأستاذ الحسن أيت لحسن</title>
  <link rel="icon" type="image/png" href="logo.png.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    html { font-size: 19px !important; }
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between p-4">

  <!-- ترويسة الصفحة -->
  <header class="max-w-2xl mx-auto text-center py-6 px-4 bg-gradient-to-r from-emerald-800 to-teal-700 text-white rounded-2xl shadow-md my-4 w-full">
    <h1 class="text-2xl font-extrabold text-amber-300 mb-2">🎁 مفاجأة اليوم المتجددة 🎁</h1>
    <p class="text-sm font-medium">نافذة يومية متجددة للمعرفة والتحدي في رحاب موقع الأستاذ الحسن أيت لحسن</p>
  </header>

  <!-- المحتوى الرئيسي (المفاجأة اليومية المتغيرة برمجياً) -->
  <main class="max-w-2xl mx-auto w-full my-auto">
    <div id="daily-surprise-container" class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 text-center">
      <div id="surprise-header" class="text-xs font-bold text-emerald-800 bg-emerald-50 py-1.5 px-3 rounded-full inline-block mb-3"></div>
      <h2 id="surprise-title" class="text-xl font-extrabold text-slate-800 mb-3"></h2>
      <div id="surprise-content" class="text-slate-600 text-sm leading-relaxed mb-6">
        <!-- محتوى مفاجأة اليوم يظهر هنا تلقائياً -->
      </div>
      <div id="surprise-action">
        <!-- أزرار التفاعل الخاصة بمفاجأة اليوم -->
      </div>
    </div>

    <!-- زر العودة للرئيسية -->
    <div class="text-center mt-6">
      <a href="index.html" class="inline-block bg-slate-700 hover:bg-slate-800 text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-all shadow">
        ← العودة إلى الصفحة الرئيسية
      </a>
    </div>
  </main>

  <!-- تذييل الصفحة -->
  <footer class="text-center py-4 text-xs text-slate-500 mt-8">
    موقع الأستاذ الحسن أيت لحسن &copy; 2026 - جميع الحقوق محفوظة
  </footer>

  <!-- السكربت البرمجي لتغيير المفاجأة حسب تاريخ اليوم -->
  <script>
    const surprisesOfTheMonth = {
      1: {
        title: "🏆 تحدي الإعراب ومتن الآجرومية",
        desc: "ابدأ أسبوعك باختبار معلوماتك النحوية في أقسام الكلمة والكلام المفيد.",
        btnText: "ابدأ التحدي الآن",
        link: "fadaa-tilmid.html"
      },
      2: {
        title: "📜 مفاجأة الأدب: نفحات من عيون الشعر",
        desc: "«لا تحسبن المجد تمراً أنت آكلهِ ... لن تبلغ المجد حتى تلعق الصبرا.»",
        btnText: "قراءة التأمل الأدبي",
        link: "qasaid.html"
      },
      3: {
        title: "🛠️ أداة اليوم: خريطة القسم الرقمية",
        desc: "استعرض تنظيم الفضاء التربوي وتوزيع الأنشطة الصفية بذكاء.",
        btnText: "فتح الخريطة",
        link: "adawatostad.html"
      },
      default: {
        title: "⭐ مفاجأة اليوم التربوية",
        desc: "محطة متجددة من المعرفة والذكر والاستغفار في رحاب موقع الأستاذ الحسن أيت لحسن.",
        btnText: "استكشف المفاجأة",
        link: "fadaa-tilmid.html"
      }
    };

    function loadDailySurprise() {
      const today = new Date();
      const dayNum = today.getDate(); // رقم اليوم (من 1 إلى 31)
      const currentSurprise = surprisesOfTheMonth[dayNum] || surprisesOfTheMonth['default'];
      
      document.getElementById('surprise-header').innerText = "📅 مفاجأة يوم " + dayNum;
      document.getElementById('surprise-title').innerText = currentSurprise.title;
      document.getElementById('surprise-content').innerText = currentSurprise.desc;
      
      const actionBox = document.getElementById('surprise-action');
      actionBox.innerHTML = `<a href="${currentSurprise.link}" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-6 rounded-xl shadow transition-all inline-block text-sm">${currentSurprise.btnText} ←</a>`;
    }

    window.addEventListener('DOMContentLoaded', loadDailySurprise);
  </script>

</body>
</html>
